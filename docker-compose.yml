services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LUMINA_MODEL: ${LUMINA_MODEL:-gpt-4o-mini}
      LUMINA_EMBED_MODEL: ${LUMINA_EMBED_MODEL:-text-embedding-3-small}
      LUMINA_SEED_SAMPLE_DOCS: ${LUMINA_SEED_SAMPLE_DOCS:-false}
    volumes:
      - lumina_vector_store:/app/backend/data/vector_store
      - lumina_logs:/app/backend/data/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  lumina_vector_store:
  lumina_logs:
