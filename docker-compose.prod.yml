services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      LUMINA_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS for production}
      LUMINA_MODEL: ${LUMINA_MODEL:-gpt-4o-mini}
      LUMINA_EMBED_MODEL: ${LUMINA_EMBED_MODEL:-text-embedding-3-small}
      LUMINA_SEED_SAMPLE_DOCS: "false"
      LUMINA_RATE_LIMIT_PER_MINUTE: ${LUMINA_RATE_LIMIT_PER_MINUTE:-120}
    volumes:
      - lumina_vector_store:/app/backend/data/vector_store
      - lumina_logs:/app/backend/data/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_LUMINA_API_KEY: ${NEXT_PUBLIC_LUMINA_API_KEY:-}
        NEXT_PUBLIC_LUMINA_TENANT_ID: ${NEXT_PUBLIC_LUMINA_TENANT_ID:-default}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  lumina_vector_store:
  lumina_logs:
